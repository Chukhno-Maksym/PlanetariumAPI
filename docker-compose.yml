services:
  planetarium_service:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db



  db:
    image: postgres:17.4-alpine3.21
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - planetarium_db:$PGDATA

volumes:
  planetarium_db: